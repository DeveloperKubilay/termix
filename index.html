<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termix</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="node_modules/xterm/css/xterm.css" />
    <script src="node_modules/xterm/lib/xterm.js"></script>
    <script src="node_modules/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
    <script src="node_modules/xterm-addon-webgl/lib/xterm-addon-webgl.js"></script>
</head>
<body>
    
    <!-- Sidebar -->
    <div class="sidebar">
        <!-- Default Navigation View -->
        <div id="sidebar-nav">
            <div class="sidebar-header">
                <i class="fa-solid fa-terminal" style="margin-right: 10px;"></i> Termix
            </div>
            <ul class="sidebar-menu">
                <li class="active" data-module="hosts"><i class="fa-solid fa-server"></i> Hosts</li>
                <li data-module="keychain"><i class="fa-solid fa-key"></i> Keychain</li>
                <li data-module="port-forwarding"><i class="fa-solid fa-network-wired"></i> Port Forwarding</li>
                <li data-module="snippets"><i class="fa-solid fa-code"></i> Snippets</li>
                <li data-module="known-hosts"><i class="fa-solid fa-fingerprint"></i> Known Hosts</li>
                <li data-module="sftp"><i class="fa-solid fa-folder-tree"></i> SFTP</li>
                <li data-module="ai" id="ai-menu-item"><i class="fa-solid fa-wand-magic-sparkles"></i> AI</li>
                <li data-module="settings"><i class="fa-solid fa-gear"></i> Settings</li>
            </ul>

            <div style="flex-grow: 1;"></div>

            <!-- Profile Section -->
            <div class="profile-section">
                <div class="profile-menu" id="profile-menu">
                    <div class="profile-menu-item" id="create-user-btn">
                        <i class="fa-solid fa-plus"></i> Create New User
                    </div>
                </div>
                <div class="profile-header" id="profile-btn">
                    <div class="profile-info">
                        <div class="profile-icon">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <span class="profile-name">User</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <i class="fa-solid fa-rotate" id="profile-sync-icon" style="display: none; font-size: 0.8em; cursor: pointer;" title="Sync Profile"></i>
                        <i class="fa-solid fa-chevron-up" id="profile-chevron"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI Chat View (Hidden by default) -->
        <div id="sidebar-ai" style="display: none; height: 100%; flex-direction: column;">
            <div class="ai-header" style="padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border);">
                <button id="ai-back-btn" style="background:none; border:none; color: var(--text-main); cursor: pointer;"><i class="fa-solid fa-arrow-left"></i></button>
                <span>AI Chat</span>
                <button id="ai-new-chat-btn" style="background:none; border:none; color: var(--text-main); cursor: pointer;"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div id="ai-chat-messages" style="flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px;">
                <div class="message ai" style="background: var(--bg-card); padding: 8px; border-radius: 6px; font-size: 0.9em;">
                    How can I help you today?
                </div>
            </div>
            <div class="ai-input-area" style="padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 5px;">
                <input type="text" id="ai-input" placeholder="Ask AI..." style="flex-grow: 1; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); padding: 6px; border-radius: 4px; outline: none;">
                <button id="ai-send-btn" style="background: var(--accent); border: none; color: var(--bg-dark); padding: 0 10px; border-radius: 4px; cursor: pointer;"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Tab Bar -->
        <div class="tab-bar" id="tab-bar">
            <div class="sidebar-toggle" id="sidebar-toggle">
                <i class="fa-solid fa-bars"></i>
            </div>
            <!-- Tabs will be generated by JS -->
        </div>

        <!-- Content Area -->
        <div id="content-area">
            <!-- Module Container (Default View) -->
            <div id="module-container" class="tab-content active"></div>
        </div>
    </div>

    <!-- Global Right Drawer -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="right-drawer" id="right-drawer">
        <div class="drawer-header">
            <h3 id="drawer-title">Details</h3>
            <div class="drawer-actions">
                <i class="fa-solid fa-check" id="drawer-check" style="cursor: pointer; margin-right: 10px;"></i>
                <i class="fa-solid fa-arrow-right-from-bracket" id="close-drawer" style="cursor: pointer;"></i>
            </div>
        </div>
        <div class="drawer-content" id="drawer-content">
            <!-- Dynamic Content -->
        </div>
    </div>

    <script src="public/modules/ai/ai.js"></script>
    <script src="public/app.js"></script>
</body>
</html>
