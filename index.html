<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="public/style.css">
</head>
<body>
    
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-terminal" style="margin-right: 10px;"></i> Vaults
        </div>
        <ul class="sidebar-menu">
            <li class="active" data-module="hosts"><i class="fa-solid fa-server"></i> Hosts</li>
            <li data-module="keychain"><i class="fa-solid fa-key"></i> Keychain</li>
            <li data-module="port-forwarding"><i class="fa-solid fa-network-wired"></i> Port Forwarding</li>
            <li data-module="snippets"><i class="fa-solid fa-code"></i> Snippets</li>
            <li data-module="known-hosts"><i class="fa-solid fa-fingerprint"></i> Known Hosts</li>
            <li data-module="logs"><i class="fa-solid fa-clock-rotate-left"></i> Logs</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Module Container -->
        <div id="module-container"></div>
    </div>

    <!-- Global Right Drawer -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="right-drawer" id="right-drawer">
        <div class="drawer-header">
            <h3 id="drawer-title">Details</h3>
            <div class="drawer-actions">
                <i class="fa-solid fa-check" id="drawer-check"></i>
                <i class="fa-solid fa-ellipsis" id="drawer-more"></i>
                <i class="fa-solid fa-arrow-right-from-bracket" id="close-drawer" style="cursor: pointer;"></i>
            </div>
        </div>
        <div class="drawer-content" id="drawer-content">
            <!-- Dynamic Content -->
        </div>
    </div>

    <script src="public/app.js"></script>
</body>
</html>
