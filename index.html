<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termix</title>
    <script>
        (function () {
            try {
                document.documentElement.setAttribute('data-theme', 'classic');
            } catch (_) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="node_modules/xterm/css/xterm.css" />
    <script src="node_modules/xterm/lib/xterm.js"></script>
    <script src="node_modules/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
    <script src="node_modules/xterm-addon-unicode11/lib/xterm-addon-unicode11.js"></script>
    <script src="node_modules/xterm-addon-webgl/lib/xterm-addon-webgl.js"></script>
</head>
<body>
    
    <!-- Sidebar -->
    <div class="sidebar">
        <!-- Default Navigation View -->
        <div id="sidebar-nav">
            <div class="sidebar-header">
                <i class="fa-solid fa-terminal" style="margin-right: 10px;"></i> Termix
            </div>
            <ul class="sidebar-menu">
                <li class="active" data-module="hosts"><i class="fa-solid fa-server"></i> Hosts</li>
                <li data-module="keychain"><i class="fa-solid fa-key"></i> Keychain</li>
                <li data-module="port-forwarding"><i class="fa-solid fa-network-wired"></i> Port Forwarding</li>
                <li data-module="snippets"><i class="fa-solid fa-code"></i> Snippets</li>
                <li data-module="known-hosts"><i class="fa-solid fa-fingerprint"></i> Known Hosts</li>
                <li data-module="sftp"><i class="fa-solid fa-folder-tree"></i> SFTP</li>
                <li data-module="ai" id="ai-menu-item"><i class="fa-solid fa-wand-magic-sparkles"></i> AI</li>
                <li data-module="settings"><i class="fa-solid fa-gear"></i> Settings</li>
            </ul>

            <div style="flex-grow: 1;"></div>

            <!-- Profile Section -->
            <div class="profile-section">
                <div class="profile-menu" id="profile-menu">
                    <div id="profile-list"></div>
                    <div class="profile-menu-item" id="create-user-btn">
                        <i class="fa-solid fa-plus"></i> Create New User
                    </div>
                </div>
                <div class="profile-header" id="profile-btn">
                    <div class="profile-info">
                        <div class="profile-icon">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <span class="profile-name">User</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <i class="fa-solid fa-rotate" id="profile-sync-icon" style="display: none; font-size: 0.8em; cursor: pointer;" title="Sync Profile"></i>
                        <i class="fa-solid fa-chevron-up" id="profile-chevron"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI Chat View (Hidden by default) -->
        <div id="sidebar-ai" class="ai-panel" style="display: none;">
            <div class="ai-header">
                <button id="ai-back-btn" class="ai-icon-btn" title="Back">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="ai-header-center">
                    <div class="ai-title">AI Chat</div>
                    <div class="ai-subtitle">Context enabled</div>
                </div>
                <button id="ai-new-chat-btn" class="ai-icon-btn" title="New Chat">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <div id="ai-chat-messages" class="ai-messages" aria-live="polite"></div>

            <div class="ai-input-area">
                <div id="ai-context-bar" class="ai-context-bar" hidden></div>
                <div class="ai-input-row">
                    <input type="text" id="ai-input" class="ai-input" placeholder="Ask AI...">
                    <button id="ai-send-btn" class="ai-send-btn" title="Send">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Tab Bar -->
        <div class="tab-bar" id="tab-bar">
            <div class="sidebar-toggle" id="sidebar-toggle">
                <i class="fa-solid fa-bars"></i>
            </div>
            <!-- Tabs will be generated by JS -->
        </div>

        <!-- Content Area -->
        <div id="content-area">
            <!-- Module Container (Default View) -->
            <div id="module-container" class="tab-content active"></div>
        </div>
    </div>

    <!-- Global Right Drawer -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="right-drawer" id="right-drawer">
        <div class="drawer-header">
            <h3 id="drawer-title">Details</h3>
            <div class="drawer-actions">
                <i class="fa-solid fa-check" id="drawer-check" style="cursor: pointer; margin-right: 10px;"></i>
                <i class="fa-solid fa-arrow-right-from-bracket" id="close-drawer" style="cursor: pointer;"></i>
            </div>
        </div>
        <div class="drawer-content" id="drawer-content">
            <!-- Dynamic Content -->
        </div>
    </div>

    <div id="app-notifications" class="app-notify-container" aria-live="polite" aria-atomic="false"></div>
    <div id="app-confirm-overlay" class="app-confirm-overlay">
        <div class="app-confirm-box" role="dialog" aria-modal="true" aria-labelledby="app-confirm-title">
            <div class="app-confirm-header">
                <i id="app-confirm-icon" class="fa-solid fa-triangle-exclamation"></i>
                <div id="app-confirm-title">Confirm Action</div>
            </div>
            <div id="app-confirm-message" class="app-confirm-message"></div>
            <label id="app-confirm-option-wrap" class="app-confirm-option" hidden>
                <input id="app-confirm-option-input" type="checkbox">
                <span id="app-confirm-option-text">Do not ask again</span>
            </label>
            <div class="app-confirm-actions">
                <button id="app-confirm-cancel" type="button" class="app-confirm-btn secondary">Cancel</button>
                <button id="app-confirm-ok" type="button" class="app-confirm-btn danger">Confirm</button>
            </div>
        </div>
    </div>

    <script src="public/modules/ai/ai.js"></script>
    <script src="public/app.js"></script>
</body>
</html>
