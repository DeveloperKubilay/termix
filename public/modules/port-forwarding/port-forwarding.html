<div class="content-area">
    <div class="pf-header-row">
        <h2 class="section-title" style="margin: 0;">Port Forwarding</h2>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" id="btn-refresh-forwards">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
            <button class="btn btn-primary" id="btn-new-forward">
                <i class="fa-solid fa-plus"></i> NEW FORWARD
            </button>
        </div>
    </div>

    <div class="pf-card">
        <div class="pf-table-wrap">
            <table class="pf-table">
                <thead>
                    <tr>
                        <th>VDS</th>
                        <th>Remote</th>
                        <th>Local</th>
                        <th>Direction</th>
                        <th>Status</th>
                        <th style="text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody id="forwards-table-body">
                    <tr>
                        <td colspan="6" class="pf-empty-cell">Loading port forwards...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<template id="forward-drawer-template">

        <div class="form-group">

                    <div class="pf-host-trigger-icon" id="pf-host-trigger-icon">
                        <i class="fa-solid fa-server"></i>
                    </div>

                    <i class="fa-solid fa-chevron-down"></i>
                </button>

                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="pf-host-search" placeholder="VDS ara">
                    </div>
                    <div class="pf-host-list" id="pf-host-list"></div>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Direction</label>
            <button type="button" class="pf-route-toggle" id="pf-route-toggle" title="Click to swap direction">
                <div class="pf-route-endpoint" id="pf-route-left">
                    <div class="pf-route-icon" id="pf-route-left-icon">
                        <i class="fa-solid fa-server"></i>
                    </div>
                    <div class="pf-route-text">
                        <div class="pf-route-title" id="pf-route-left-title">VDS</div>
                        <div class="pf-route-sub" id="pf-route-left-sub">Remote machine</div>
                    </div>
                </div>
                <div class="pf-route-arrow">
                    <i class="fa-solid fa-arrow-left-long" id="pf-route-arrow-icon"></i>
                </div>
                <div class="pf-route-endpoint" id="pf-route-right">
                    <div class="pf-route-icon" id="pf-route-right-icon">
                        <i class="fa-solid fa-laptop"></i>
                    </div>

                        <div class="pf-route-title" id="pf-route-right-title">My PC</div>
                        <div class="pf-route-sub" id="pf-route-right-sub">Local machine</div>
                    </div>
                </div>
            </button>
        </div>

        <div class="pf-endpoint-sections">
            <div class="pf-endpoint-section" id="pf-remote-section">
                <div class="form-section-title" id="pf-remote-section-title">1. VDS</div>
                <div class="form-group">
                    <label id="pf-remote-host-label">Host (VDS)</label>
                    <input type="text" id="pf-remote-host" value="0.0.0.0" placeholder="0.0.0.0">
                </div>
                <div class="form-group">
                    <label id="pf-remote-port-label">Port (VDS)</label>
                    <input type="number" id="pf-remote-port" min="1" max="65535" step="1" inputmode="numeric" placeholder="5432">
                </div>
            </div>

            <div class="pf-endpoint-section" id="pf-local-section">
                <div class="form-section-title" id="pf-local-section-title">2. My PC</div>
                <div class="form-group">
                    <label id="pf-local-host-label">Host (My PC)</label>
                    <input type="text" id="pf-local-host" value="127.0.0.1" placeholder="127.0.0.1">
                </div>
                <div class="form-group">
                    <label id="pf-local-port-label">Port (My PC)</label>
                    <input type="number" id="pf-local-port" min="1" max="65535" step="1" inputmode="numeric" placeholder="15432">
                </div>
            </div>
        </div>

        <button class="btn-connect-large btn-drawer-primary" id="pf-add-forward-btn">Ekle</button>
        <div id="pf-drawer-error" class="pf-error"></div>
