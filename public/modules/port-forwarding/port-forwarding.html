<div class="content-area">
    <div class="pf-header-row">
        <h2 class="section-title" style="margin: 0;">Port Forwarding</h2>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" id="btn-refresh-forwards">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
            <button class="btn btn-primary" id="btn-new-forward">
                <i class="fa-solid fa-plus"></i> NEW FORWARD
            </button>
        </div>
    </div>

    <div class="pf-card">
        <div class="pf-table-wrap">
            <table class="pf-table">
                <thead>
                    <tr>
                        <th>VDS</th>
                        <th>Remote</th>
                        <th>Local</th>
                        <th>Status</th>
                        <th style="text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody id="forwards-table-body">
                    <tr>
                        <td colspan="5" class="pf-empty-cell">Loading port forwards...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<template id="forward-drawer-template">
    <div class="pf-drawer-layout">
        <div class="form-section-title">Uzaktan Sunucu</div>

        <div class="form-group">
            <label>VDS Secimi</label>
            <div class="pf-host-picker" id="pf-host-picker">
                <button type="button" class="pf-host-trigger" id="pf-host-trigger">
                    <div class="pf-host-trigger-icon" id="pf-host-trigger-icon">
                        <i class="fa-solid fa-server"></i>
                    </div>
                    <div class="pf-host-trigger-text" id="pf-host-trigger-text">Bir VDS secin</div>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>

                <div class="pf-host-dropdown" id="pf-host-dropdown">
                    <div class="search-tags pf-host-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="pf-host-search" placeholder="VDS ara">
                    </div>
                    <div class="pf-host-list" id="pf-host-list"></div>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Uzaktan Host</label>
            <input type="text" id="pf-remote-host" value="127.0.0.1" placeholder="127.0.0.1">
        </div>

        <div class="form-group">
            <label>Uzaktan Port</label>
            <input type="number" id="pf-remote-port" min="1" max="65535" placeholder="5432">
        </div>

        <div class="form-section-title">Local Ayarlar</div>

        <div class="form-group">
            <label>Local Host</label>
            <input type="text" id="pf-local-host" value="127.0.0.1" placeholder="127.0.0.1">
        </div>

        <div class="form-group">
            <label>Local Port</label>
            <input type="number" id="pf-local-port" min="1" max="65535" placeholder="15432">
        </div>

        <button class="btn-connect-large btn-drawer-primary" id="pf-add-forward-btn">Ekle</button>
        <div id="pf-drawer-error" class="pf-error"></div>
    </div>
</template>
