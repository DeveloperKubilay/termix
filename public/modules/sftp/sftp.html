<div class="content-area sftp-module">
    <div class="sftp-header-row">
        <h2 class="section-title" style="margin: 0;">SFTP File Manager</h2>
        <div id="sftp-global-status" class="sftp-status info">Hazir</div>
    </div>

    <div class="sftp-grid">
        <section class="sftp-pane" id="sftp-pane-left" data-pane="left">
            <div class="sftp-pane-toolbar">
                <div class="sftp-mode-switch" id="sftp-mode-left">
                    <button type="button" data-pane="left" data-mode="local" class="active">Local</button>
                    <button type="button" data-pane="left" data-mode="vds">VDS</button>
                </div>
                <div class="sftp-conn-text" id="sftp-conn-left">Local</div>
                <button type="button" class="btn btn-primary sftp-disconnect-btn" id="sftp-disconnect-left">Baglantiyi Kes</button>
            </div>

            <div class="sftp-path-stack">
                <div class="sftp-breadcrumbs" id="sftp-breadcrumbs-left"></div>
                <div class="sftp-path-row">
                    <input id="sftp-path-left" type="text" spellcheck="false" placeholder="Path">
                    <button class="btn btn-primary" id="sftp-go-left">Go</button>
                    <button class="btn btn-primary" id="sftp-refresh-left" title="Refresh">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>
            </div>

            <div class="sftp-table-head">
                <span>Ad</span>
                <span>Boyut</span>
                <span>Tarih</span>
            </div>
            <div class="sftp-file-list" id="sftp-list-left" tabindex="0"></div>

            <div class="sftp-host-overlay" id="sftp-overlay-left">
                <div class="sftp-host-card">
                    <div class="sftp-host-title">VDS Sec</div>
                    <div class="sftp-host-search-row">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input id="sftp-host-search-left" type="text" spellcheck="false" placeholder="VDS ara...">
                    </div>
                    <div class="sftp-host-list" id="sftp-host-list-left"></div>
                </div>
            </div>
        </section>

        <section class="sftp-pane" id="sftp-pane-right" data-pane="right">
            <div class="sftp-pane-toolbar">
                <div class="sftp-mode-switch" id="sftp-mode-right">
                    <button type="button" data-pane="right" data-mode="local">Local</button>
                    <button type="button" data-pane="right" data-mode="vds" class="active">VDS</button>
                </div>
                <div class="sftp-conn-text" id="sftp-conn-right">Bagli degil</div>
                <button type="button" class="btn btn-primary sftp-disconnect-btn" id="sftp-disconnect-right">Baglantiyi Kes</button>
            </div>

            <div class="sftp-path-stack">
                <div class="sftp-breadcrumbs" id="sftp-breadcrumbs-right"></div>
                <div class="sftp-path-row">
                    <input id="sftp-path-right" type="text" spellcheck="false" placeholder="Path">
                    <button class="btn btn-primary" id="sftp-go-right">Go</button>
                    <button class="btn btn-primary" id="sftp-refresh-right" title="Refresh">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>
            </div>

            <div class="sftp-table-head">
                <span>Ad</span>
                <span>Boyut</span>
                <span>Tarih</span>
            </div>
            <div class="sftp-file-list" id="sftp-list-right" tabindex="0"></div>

            <div class="sftp-host-overlay" id="sftp-overlay-right">
                <div class="sftp-host-card">
                    <div class="sftp-host-title">VDS Sec</div>
                    <div class="sftp-host-search-row">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input id="sftp-host-search-right" type="text" spellcheck="false" placeholder="VDS ara...">
                    </div>
                    <div class="sftp-host-list" id="sftp-host-list-right"></div>
                </div>
            </div>
        </section>
    </div>

    <div id="sftp-context-menu" class="sftp-context-menu" role="menu" aria-label="Dosya Islemleri">

            <span>Yeni klasor</span>
        </button>
        <button type="button" class="sftp-context-action" data-action="create-file">
            <i class="fa-regular fa-file-lines"></i>
            <span>Yeni dosya</span>
        </button>
        <div class="sftp-context-sep"></div>
        <button type="button" class="sftp-context-action" data-action="rename">
            <i class="fa-solid fa-i-cursor"></i>
            <span>Yeniden adlandir</span>
        </button>
        <button type="button" class="sftp-context-action danger" data-action="delete">
            <i class="fa-solid fa-trash"></i>
            <span>Sil</span>
        </button>
    </div>

    <div id="sftp-rename-overlay" class="sftp-rename-overlay">
        <div class="sftp-rename-dialog" role="dialog" aria-modal="true" aria-labelledby="sftp-rename-title">
