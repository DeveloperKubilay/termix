<div class="content-area">
    <style>
        .key-item:hover .key-actions {
            opacity: 1 !important;
        }
    </style>
    <h2 class="section-title">Keychain</h2>
    <div style="padding: 20px;">
        <button class="btn btn-primary" id="btn-new-key"><i class="fa-solid fa-plus"></i> NEW KEY</button>
        <div style="margin-top: 20px;" id="keys-list">
            <p style="color: var(--text-muted);">No keys found. Add your SSH keys here.</p>
        </div>
    </div>
</div>

<template id="key-edit-template">
    <div style="height: 100%; display: flex; flex-direction: column;">
        <div class="form-group">
            <label>Filename</label>
            <input type="text" id="edit-key-filename" placeholder="Filename">
        </div>

        <div class="form-group" style="flex: 1; display: flex; flex-direction: column;">
            <label>Content</label>
            <textarea id="edit-key-content" style="flex: 1; width: 100%; padding: 12px; background: #181825; border: 1px solid #313244; color: #cdd6f4; border-radius: 6px; font-family: 'JetBrains Mono', monospace; resize: none; outline: none; font-size: 13px;"></textarea>
        </div>

        <button id="btn-save-key" class="btn-connect-large btn-drawer-primary">Save Changes</button>
    </div>
</template>
