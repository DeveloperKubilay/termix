<div class="content-area">
    <div class="sn-header-row">
        <h2 class="section-title" style="margin: 0;">Snippets</h2>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" id="btn-refresh-snippets">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
            <button class="btn btn-primary" id="btn-new-snippet">
                <i class="fa-solid fa-plus"></i> NEW SNIPPET
            </button>
        </div>
    </div>

    <div class="sn-card">
        <div id="snippets-list" class="snippets-list">
            <div class="sn-empty-state">Loading snippets...</div>
        </div>
    </div>
</div>

<template id="snippet-drawer-template">

        <div class="form-section-title">Ekleme Tipi</div>

        <div class="sn-mode-grid">
            <label class="sn-mode-card active" id="sn-mode-url-card">
                <input type="radio" name="snippetMode" value="url" checked style="display: none;">
                <i class="fa-solid fa-link"></i>
                <span>URL Secme</span>
            </label>
            <label class="sn-mode-card" id="sn-mode-manual-card">
                <input type="radio" name="snippetMode" value="manual" style="display: none;">
                <i class="fa-solid fa-keyboard"></i>
                <span>Kendin Ekle</span>
            </label>
        </div>

        <div id="snippet-url-section" class="sn-mode-section">
            <div class="form-group">
                <label>JSON URL</label>
                <input type="text" id="snippet-url-input" placeholder="https://example.com/snippets.json">
            </div>
            <p class="sn-help">
                Desteklenen formatlar: <code>[{ "name": "...", "command": "..." }]</code>, <code>{ "snippets": [...] }</code> veya <code>{ "name": "command" }</code>.
            </p>
        </div>

        <div id="snippet-manual-section" class="sn-mode-section" style="display: none;">
            <div class="form-group">
                <label>Komut Ismi</label>
                <input type="text" id="snippet-name-input" placeholder="Restart Nginx">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>Komut</label>
                <textarea id="snippet-command-input" placeholder="sudo systemctl restart nginx"></textarea>
            </div>
        </div>

        <button id="snippet-save-btn" class="btn-connect-large btn-drawer-primary">Kaydet</button>
        <div id="snippet-drawer-status" class="sn-drawer-status"></div>
    </div>
</template>
