<div class="content-area">
    <div class="sn-header-row">
        <h2 class="section-title" style="margin: 0;">Snippets</h2>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" id="btn-refresh-snippets">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
            <button class="btn btn-primary" id="btn-new-snippet">
                <i class="fa-solid fa-plus"></i> NEW SNIPPET
            </button>
        </div>
    </div>

    <div class="sn-card">
        <div id="snippets-list" class="snippets-list">
            <div class="sn-empty-state">Loading snippets...</div>
        </div>
    </div>
</div>

<template id="snippet-drawer-template">
    <div class="sn-drawer-layout">
        <div class="form-section-title">Add Type</div>

        <div class="sn-mode-grid">
            <label class="sn-mode-card active" id="sn-mode-url-card">
                <input type="radio" name="snippetMode" value="url" checked style="display: none;">
                <i class="fa-solid fa-link"></i>
                <span>Select URL</span>
            </label>
            <label class="sn-mode-card" id="sn-mode-manual-card">
                <input type="radio" name="snippetMode" value="manual" style="display: none;">
                <i class="fa-solid fa-keyboard"></i>
                <span>Add Manually</span>
            </label>
        </div>

        <div id="snippet-url-section" class="sn-mode-section">
            <div class="form-group">
                <label>JSON URL</label>
                <input type="text" id="snippet-url-input" placeholder="https://example.com/snippets.json">
            </div>
            <p class="sn-help">
                Supported formats: <code>[{ "name": "...", "command": "..." }]</code>, <code>{ "snippets": [...] }</code> or <code>{ "name": "command" }</code>.
            </p>
        </div>

        <div id="snippet-manual-section" class="sn-mode-section" style="display: none;">
            <div class="form-group">
                <label>Command Name</label>
                <input type="text" id="snippet-name-input" placeholder="Restart Nginx">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>Command</label>
                <textarea id="snippet-command-input" placeholder="sudo systemctl restart nginx"></textarea>
            </div>
        </div>

        <button id="snippet-save-btn" class="btn-connect-large btn-drawer-primary">Save</button>
        <div id="snippet-drawer-status" class="sn-drawer-status"></div>
    </div>
</template>

<template id="snippet-use-drawer-template">
    <div class="sn-run-layout">
        <div class="form-section-title">Snippet</div>
        <pre class="sn-run-command" id="sn-run-command-preview"></pre>

        <div class="form-section-title">VDS Selection</div>
        <div class="form-group">
            <label>VDS</label>
            <div class="pf-host-picker">
                <button type="button" class="pf-host-trigger" id="sn-run-host-trigger">
                    <div class="pf-host-trigger-icon" id="sn-run-host-trigger-icon">
                        <i class="fa-solid fa-server"></i>
                    </div>
                    <div class="pf-host-trigger-text" id="sn-run-host-trigger-text">Select a VDS</div>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>

                <div class="pf-host-dropdown" id="sn-run-host-dropdown">
                    <div class="search-tags pf-host-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="sn-run-host-search" placeholder="Search VDS">
                    </div>
                    <div class="pf-host-list" id="sn-run-host-list"></div>
                </div>
            </div>
        </div>

        <button class="btn-connect-large btn-drawer-primary" id="sn-run-btn">Run on VDS</button>
        <div id="sn-run-error" class="pf-error"></div>
    </div>
</template>
