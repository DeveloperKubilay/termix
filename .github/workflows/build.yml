name: Build/Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Check for outdated packages
        run: npm outdated || true

  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    env:
      BUILD_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set auto version
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.version=process.env.BUILD_VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n'); console.log('Version =>', pkg.version);"

      - name: Install Dependencies
        run: npm ci

      - name: Remove incompatible optional native modules
        run: node -e "require('fs').rmSync('node_modules/cpu-features',{recursive:true,force:true})"

      - name: Build
        run: npm run build -- --${{ matrix.platform }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.yml
            dist/*.yaml
            dist/*.blockmap

  android:
    runs-on: ubuntu-latest
    needs: audit

    env:
      BUILD_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set auto version
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.version=process.env.BUILD_VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n'); console.log('Version =>', pkg.version);"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set Android versionCode and versionName
        run: |
          node -e "
          const fs = require('fs');
          const v = process.env.BUILD_VERSION;
          const code = parseInt(v.split('.')[2], 10) || 1;
          let g = fs.readFileSync('android/app/build.gradle', 'utf8');
          g = g.replace(/versionCode \d+/, 'versionCode ' + code);
          g = g.replace(/versionName \"[^\"]*\"/, 'versionName \"' + v + '\"');
          fs.writeFileSync('android/app/build.gradle', g);
          console.log('Android version =>', v, '(code ' + code + ')');
          "

      - name: Write android/local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build web assets and sync Capacitor
        run: npm run sync:android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p android-out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android-out/Termix-${{ env.BUILD_VERSION }}-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android-out/Termix-*.apk

  release:
    needs: [audit, build, android]
    runs-on: ubuntu-latest

    env:
      BUILD_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_VERSION }}
          name: v${{ env.BUILD_VERSION }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
