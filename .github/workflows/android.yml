name: Android APK Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            util/android/package-lock.json

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      - name: Install Node dependencies
        run: npm ci

      - name: Install locked Android dependencies
        run: npm ci --prefix util/android --ignore-scripts --omit=optional

      - name: Run Android unit & contract tests
        run: npm run android:test

      - name: Download & verify pinned native runtime
        run: npm run android:runtime:preview

      - name: Prepare bundled web and backend assets
        run: npm run android:prepare

      - name: Build Android Debug APK
        run: |
          chmod +x android/gradlew
          npm run android:build:preview -- -PtermixAbis=arm64-v8a,x86_64

      - name: Verify generated APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: termix-android-preview-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
